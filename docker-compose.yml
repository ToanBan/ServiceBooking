services:
  db:
    image: postgres:16
    container_name: servicebooking-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: servicebooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicebooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: